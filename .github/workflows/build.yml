name: Build Executables

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build-linux:
    name: Build Linux (x86_64)
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc \
            libgl1-mesa-glx \
            libegl1-mesa \
            libxcb-xinerama0 \
            libxcb-cursor0 \
            libxkbcommon0 \
            libdbus-1-3 \
            libfontconfig1 \
            libfreetype6 \
            dpkg-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 pyinstaller

      - name: Build with PyInstaller
        run: |
          # Создаём директорию для шрифтов
          mkdir -p fonts
          # Скачиваем шрифты DejaVu
          curl -fsSL "https://github.com/dejavu-fonts/dejavu-fonts/raw/master/ttf/DejaVuSans.ttf" -o fonts/DejaVuSans.ttf
          curl -fsSL "https://github.com/dejavu-fonts/dejavu-fonts/raw/master/ttf/DejaVuSans-Bold.ttf" -o fonts/DejaVuSans-Bold.ttf
          curl -fsSL "https://github.com/dejavu-fonts/dejavu-fonts/raw/master/ttf/DejaVuSansMono.ttf" -o fonts/DejaVuSansMono.ttf
          curl -fsSL "https://github.com/dejavu-fonts/dejavu-fonts/raw/master/ttf/DejaVuSerif.ttf" -o fonts/DejaVuSerif.ttf
          
          echo "Fonts directory:"
          ls -la fonts/
          
          python -m PyInstaller --clean --noconfirm --onedir --name graphics_editor main.py \
            --hidden-import PySide6 \
            --hidden-import PySide6.QtCore \
            --hidden-import PySide6.QtGui \
            --hidden-import PySide6.QtWidgets \
            --hidden-import PySide6.QtSvg \
            --hidden-import PySide6.QtXml \
            --hidden-import matplotlib \
            --hidden-import matplotlib.backends.backend_agg \
            --hidden-import matplotlib.font_manager \
            --hidden-import matplotlib.pyplot \
            --hidden-import numpy \
            --hidden-import PIL \
            --hidden-import PIL.Image \
            --add-data "app_settings.json:." \
            --add-data "fonts:fonts" \
            --exclude-module tkinter \
            --exclude-module unittest \
            --exclude-module xml.etree \
            --exclude-module setuptools \
            --exclude-module distutils
          
          echo "Checking dist/graphics_editor for fonts:"
          ls -la dist/graphics_editor/fonts/ 2>/dev/null || echo "Fonts NOT found in dist!"

      - name: Package Linux binary (tar.gz)
        run: |
          cd dist
          tar -czf graphics_editor-linux-x86_64.tar.gz graphics_editor/

      - name: Package Linux binary (DEB)
        run: |
          chmod +x scripts/package_deb.sh
          mkdir -p dist/deb
          # Для workflow_dispatch (не тег) используем app_version.py
          VERSION="${{ github.ref_name }}"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION=$(grep '__version__' app_version.py | sed 's/__version__ = "\(.*\)"/\1/')
          fi
          VERSION="${VERSION#v}"
          ./scripts/package_deb.sh dist dist/deb "${VERSION}"

      - name: Package Linux binary (AppImage)
        run: |
          chmod +x scripts/package_appimage.sh
          mkdir -p dist/appimage
          # Для workflow_dispatch (не тег) используем app_version.py
          VERSION="${{ github.ref_name }}"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION=$(grep '__version__' app_version.py | sed 's/__version__ = "\(.*\)"/\1/')
          fi
          VERSION="${VERSION#v}"
          ./scripts/package_appimage.sh dist dist/appimage "${VERSION}"

      - name: Upload Linux artifact (tar.gz)
        uses: actions/upload-artifact@v4
        with:
          name: graphics_editor-linux-x86_64
          path: dist/graphics_editor-linux-x86_64.tar.gz
          retention-days: 30

      - name: Upload Linux artifact (DEB)
        uses: actions/upload-artifact@v4
        with:
          name: graphics_editor-linux-x86_64-deb
          path: dist/deb/*.deb
          retention-days: 30

      - name: Upload Linux artifact (AppImage)
        uses: actions/upload-artifact@v4
        with:
          name: graphics_editor-linux-x86_64-appimage
          path: dist/appimage/*.AppImage
          retention-days: 30

  build-windows:
    name: Build Windows (x86_64)
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 pyinstaller

      - name: Build with PyInstaller
        run: |
          # Создаём директорию для шрифтов
          mkdir -p fonts
          # Скачиваем шрифты DejaVu
          curl -fsSL "https://github.com/dejavu-fonts/dejavu-fonts/raw/master/ttf/DejaVuSans.ttf" -o fonts/DejaVuSans.ttf
          curl -fsSL "https://github.com/dejavu-fonts/dejavu-fonts/raw/master/ttf/DejaVuSans-Bold.ttf" -o fonts/DejaVuSans-Bold.ttf
          curl -fsSL "https://github.com/dejavu-fonts/dejavu-fonts/raw/master/ttf/DejaVuSansMono.ttf" -o fonts/DejaVuSansMono.ttf
          curl -fsSL "https://github.com/dejavu-fonts/dejavu-fonts/raw/master/ttf/DejaVuSerif.ttf" -o fonts/DejaVuSerif.ttf
          
          python -m PyInstaller --clean --noconfirm --onedir --name graphics_editor main.py `
            --hidden-import PySide6 `
            --hidden-import PySide6.QtCore `
            --hidden-import PySide6.QtGui `
            --hidden-import PySide6.QtWidgets `
            --hidden-import PySide6.QtSvg `
            --hidden-import PySide6.QtXml `
            --hidden-import matplotlib `
            --hidden-import matplotlib.backends.backend_agg `
            --hidden-import matplotlib.font_manager `
            --hidden-import matplotlib.pyplot `
            --hidden-import numpy `
            --hidden-import PIL `
            --hidden-import PIL.Image `
            --add-data "app_settings.json;." `
            --add-data "fonts;fonts" `
            --exclude-module tkinter `
            --exclude-module unittest `
            --exclude-module xml.etree `
            --exclude-module setuptools `
            --exclude-module distutils

      - name: Package Windows binary
        run: |
          Compress-Archive -Path dist\graphics_editor -DestinationPath dist\graphics_editor-win-x86_64.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: graphics_editor-win-x86_64
          path: dist/graphics_editor-win-x86_64.zip
          retention-days: 30

  release:
    name: Create Release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-22.04
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download Linux artifact (tar.gz)
        uses: actions/download-artifact@v4
        with:
          name: graphics_editor-linux-x86_64
          path: release/

      - name: Download Linux artifact (DEB)
        uses: actions/download-artifact@v4
        with:
          name: graphics_editor-linux-x86_64-deb
          path: release/

      - name: Download Linux artifact (AppImage)
        uses: actions/download-artifact@v4
        with:
          name: graphics_editor-linux-x86_64-appimage
          path: release/

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: graphics_editor-win-x86_64
          path: release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          draft: false
          prerelease: false
          generate_release_notes: true

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Update app_version.py
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          VERSION="${VERSION#v}"
          sed -i "s/__version__ = \".*\"/__version__ = \"${VERSION}\"/" app_version.py
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app_version.py
          git commit -m "chore: update version to $VERSION" || echo "No changes to commit"
          git fetch origin main:main
          git checkout main
          git push origin main
